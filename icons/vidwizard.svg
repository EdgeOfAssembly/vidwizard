<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">vidwizard</title>
  <desc id="desc">Dark teal rounded tile with a film-gate frame, a play chevron, and a gold magician’s wand sparking at the tip.</desc>

  <defs>
    <!-- Sharp 4-point spark; reuse at several sizes. -->
    <path id="spark4"
          d="M0,-1 L0.2,-0.2 L1,0 L0.2,0.2 L0,1 L-0.2,0.2 L-1,0 L-0.2,-0.2 Z"/>
  </defs>

  <!-- App tile: rounded square, transparent corners (RGBA). -->
  <rect width="512" height="512" rx="104" ry="104" fill="#0A332F"/>

  <!-- Film gate / monitor bezel — thick enough to read at 32px. -->
  <rect x="72" y="122" width="368" height="268" rx="30" ry="30" fill="#1B8C82"/>
  <rect x="112" y="154" width="288" height="204" rx="16" ry="16" fill="#0A332F"/>

  <!-- Play chevron, optically centered in the gate. -->
  <path fill="#F6F1E4"
        d="M198 170 L198 342 L374 256 Z"/>

  <!-- Wand: gold shaft, cream tip, darker ferrule; tip at upper-right. -->
  <g transform="translate(400 134) rotate(42)">
    <rect x="-14" y="0" width="28" height="268" rx="14" fill="#E0B33A"/>
    <rect x="-14" y="-8" width="28" height="52" rx="14" fill="#F6F1E4"/>
    <rect x="-14" y="36" width="28" height="16" rx="4" fill="#C4921F"/>
  </g>

  <!-- Magic sparks at the wand tip (8-point = two 4-point stars). -->
  <g fill="#FFE27A" transform="translate(400 134)">
    <use href="#spark4" transform="scale(58)"/>
    <use href="#spark4" transform="rotate(45) scale(34)" fill="#FFF6C8"/>
  </g>
  <use href="#spark4" transform="translate(456 186) scale(20)" fill="#FFE27A"/>
  <use href="#spark4" transform="translate(352 96) scale(14)" fill="#FFF6C8"/>
</svg>
